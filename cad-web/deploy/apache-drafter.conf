# Exemplo de VirtualHost Apache para o Drafter (CAD Web)
# Copie para /etc/apache2/sites-available/drafter.conf (Debian/Ubuntu)
# ou /etc/httpd/conf.d/drafter.conf (RHEL/CentOS/Fedora)
#
# Ajuste ServerName, DocumentRoot e caminhos conforme o servidor.

<VirtualHost *:80>
    ServerName cad.exemplo.local
    # ServerAlias www.cad.exemplo.local

    # Pasta do build de produção (conteúdo de cad-web/dist)
    DocumentRoot /var/www/drafter

    <Directory /var/www/drafter>
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo
        Require all granted

        DirectoryIndex index.html

        # WebAssembly (DWG)
        AddType application/wasm .wasm
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/drafter-error.log
    CustomLog ${APACHE_LOG_DIR}/drafter-access.log combined

    # Se APACHE_LOG_DIR não existir (httpd), use:
    # ErrorLog /var/log/httpd/drafter-error.log
    # CustomLog /var/log/httpd/drafter-access.log combined
</VirtualHost>

